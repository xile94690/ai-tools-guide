<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>

  <rect x="120" y="70" width="960" height="620" rx="16" fill="#0b0b0f"/>
  <path d="M136 70 h928 a16 16 0 0 1 16 16 v28 h-960 v-28 a16 16 0 0 1 16 -16 z" fill="#18181b"/>
  <rect x="120" y="70" width="960" height="620" rx="16" fill="none" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="156" cy="92" r="7" fill="#ff5f57"/>
  <circle cx="178" cy="92" r="7" fill="#febc2e"/>
  <circle cx="200" cy="92" r="7" fill="#28c840"/>
  <rect x="390" y="78" width="420" height="28" rx="14" fill="#27272a"/>
  <text x="600" y="97" text-anchor="middle" fill="#a1a1aa" font-size="14">app.runwayml.com</text>

  <text x="160" y="166" fill="#e4e4e7" font-size="18" font-weight="600">Credits &amp; Camera Moves</text>
  <text x="160" y="192" fill="#a1a1aa" font-size="13">右侧面板设置参数，提示词里写运镜</text>

  <rect x="160" y="216" width="420" height="300" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="186" y="254" fill="#a1a1aa" font-size="13">每次生成消耗的积分</text>

  <text x="186" y="300" fill="#e4e4e7" font-size="15">Gen-4.5</text>
  <text x="500" y="300" text-anchor="end" fill="#67e8f9" font-size="15">60 credits / 5s</text>
  <line x1="186" y1="320" x2="554" y2="320" stroke="#27272a" stroke-width="1"/>

  <text x="186" y="356" fill="#e4e4e7" font-size="15">Gen-4 Turbo</text>
  <text x="500" y="356" text-anchor="end" fill="#67e8f9" font-size="15">5 credits / s</text>
  <line x1="186" y1="376" x2="554" y2="376" stroke="#27272a" stroke-width="1"/>

  <text x="186" y="412" fill="#e4e4e7" font-size="15">Gen-4 Image</text>
  <text x="500" y="412" text-anchor="end" fill="#67e8f9" font-size="15">8 credits / image</text>
  <line x1="186" y1="432" x2="554" y2="432" stroke="#27272a" stroke-width="1"/>

  <text x="186" y="468" fill="#e4e4e7" font-size="15">Aleph 2.0 (Edit Studio)</text>
  <text x="500" y="468" text-anchor="end" fill="#67e8f9" font-size="15">140 credits / 5s</text>

  <rect x="610" y="216" width="450" height="300" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="636" y="254" fill="#a1a1aa" font-size="13">运镜提示词（直接抄）</text>

  <text x="636" y="296" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e4e4e7">slow dolly push-in</text>
  <text x="636" y="326" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e4e4e7">pan left, tilt up</text>
  <text x="636" y="356" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e4e4e7">handheld tracking shot</text>
  <text x="636" y="386" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e4e4e7">orbit around the subject</text>
  <text x="636" y="416" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e4e4e7">crane up, wide reveal</text>
  <text x="636" y="446" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e4e4e7">zoom out slowly, static subject</text>
  <text x="636" y="476" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e4e4e7">static camera, subtle motion only</text>

  <text x="600" y="580" text-anchor="middle" fill="#a1a1aa" font-size="13">模型认“专业摄影词汇”比认“电影感 / 高级感”更准</text>
  <text x="600" y="606" text-anchor="middle" fill="#a1a1aa" font-size="13">先在 Turbo 上快速试，满意再切 Gen-4.5 出片</text>

  <text x="1180" y="740" text-anchor="end" fill="#a1a1aa" font-size="13">示意图</text>
</svg>
