<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>

  <rect x="120" y="70" width="960" height="620" rx="16" fill="#ffffff"/>
  <path d="M136 70 h928 a16 16 0 0 1 16 16 v28 h-960 v-28 a16 16 0 0 1 16 -16 z" fill="#f4f4f5"/>
  <line x1="120" y1="114" x2="1080" y2="114" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="120" y="70" width="960" height="620" rx="16" fill="none" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="156" cy="92" r="7" fill="#ff5f57"/>
  <circle cx="178" cy="92" r="7" fill="#febc2e"/>
  <circle cx="200" cy="92" r="7" fill="#28c840"/>

  <rect x="400" y="78" width="400" height="28" rx="14" fill="#e4e4e7"/>
  <text x="600" y="97" text-anchor="middle" fill="#71717a" font-size="14">my-project — VS Code — Cline</text>

  <text x="160" y="166" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">src/cache/keys.ts</text>
  <text x="160" y="214" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#18181b">export const productKey = (id) =&gt;</text>
  <text x="160" y="246" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#18181b">  `product:${id}`;</text>

  <line x1="664" y1="130" x2="664" y2="674" stroke="#e4e4e7" stroke-width="1"/>

  <text x="688" y="166" font-size="15" font-weight="600" fill="#18181b">Cline</text>
  <rect x="960" y="146" width="60" height="26" rx="13" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <text x="990" y="164" text-anchor="middle" font-size="11" fill="#71717a">Plan</text>

  <rect x="688" y="192" width="336" height="66" rx="12" fill="#f4f4f5"/>
  <text x="706" y="220" font-size="13" fill="#18181b">Cache keys ignore the locale, so users</text>
  <text x="706" y="242" font-size="13" fill="#18181b">see the wrong currency. Please fix.</text>

  <text x="688" y="292" font-size="13" fill="#18181b">I will add the locale to the cache key.</text>

  <rect x="688" y="310" width="336" height="150" rx="10" fill="#0b0b0f"/>
  <text x="706" y="338" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#a1a1aa">src/cache/keys.ts</text>
  <text x="706" y="364" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#f87171">- export const productKey = (id) =&gt;</text>
  <text x="706" y="384" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#f87171">-   `product:${id}`;</text>
  <text x="706" y="410" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#4ade80">+ export const productKey = (id, locale) =&gt;</text>
  <text x="706" y="430" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#4ade80">+   `product:${locale}:${id}`;</text>

  <rect x="688" y="486" width="160" height="40" rx="8" fill="#18181b"/>
  <text x="768" y="511" text-anchor="middle" font-size="13" fill="#ffffff">✓ Approve</text>
  <rect x="864" y="486" width="160" height="40" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="944" y="511" text-anchor="middle" font-size="13" fill="#18181b">✕ Reject</text>

  <text x="688" y="566" font-size="12" fill="#71717a">Nothing is written to disk until you approve.</text>

  <rect x="688" y="588" width="336" height="56" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="706" y="620" font-size="13" fill="#a1a1aa">Type a message, or @ to add files…</text>

  <text x="1180" y="740" text-anchor="end" fill="#a1a1aa" font-size="13">示意图</text>
</svg>
