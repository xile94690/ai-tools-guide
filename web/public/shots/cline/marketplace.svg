<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>

  <rect x="120" y="70" width="960" height="620" rx="16" fill="#ffffff"/>
  <path d="M136 70 h928 a16 16 0 0 1 16 16 v28 h-960 v-28 a16 16 0 0 1 16 -16 z" fill="#f4f4f5"/>
  <line x1="120" y1="114" x2="1080" y2="114" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="120" y="70" width="960" height="620" rx="16" fill="none" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="156" cy="92" r="7" fill="#ff5f57"/>
  <circle cx="178" cy="92" r="7" fill="#febc2e"/>
  <circle cx="200" cy="92" r="7" fill="#28c840"/>

  <rect x="400" y="78" width="400" height="28" rx="14" fill="#e4e4e7"/>
  <text x="600" y="97" text-anchor="middle" fill="#71717a" font-size="14">Visual Studio Code</text>

  <rect x="120" y="114" width="420" height="576" fill="#fafafa"/>
  <line x1="540" y1="114" x2="540" y2="690" stroke="#e4e4e7" stroke-width="1"/>

  <text x="160" y="164" font-size="16" font-weight="600" fill="#18181b">Extensions</text>
  <rect x="160" y="184" width="352" height="36" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="178" y="208" font-size="13" fill="#18181b">Cline</text>

  <rect x="160" y="244" width="352" height="104" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <rect x="176" y="262" width="44" height="44" rx="10" fill="#18181b"/>
  <text x="198" y="290" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">CL</text>
  <text x="234" y="282" font-size="14" font-weight="600" fill="#18181b">Cline</text>
  <text x="234" y="302" font-size="12" fill="#71717a">Cline</text>
  <rect x="234" y="312" width="76" height="22" rx="6" fill="#0e639c"/>
  <text x="272" y="328" text-anchor="middle" font-size="12" fill="#ffffff">Install</text>

  <text x="176" y="396" font-size="14" font-weight="600" fill="#18181b">Cline</text>
  <text x="176" y="416" font-size="12" fill="#71717a">Autonomous coding agent in your editor</text>

  <text x="160" y="500" font-size="12" fill="#71717a">Open VSX / VSCodium / Windsurf users:</text>
  <text x="160" y="522" font-size="12" fill="#71717a">install the same extension from open-vsx.org,</text>
  <text x="160" y="544" font-size="12" fill="#71717a">or download the .vsix and use</text>
  <text x="160" y="566" font-size="12" fill="#71717a">Extensions ▸ … ▸ Install from VSIX…</text>

  <text x="580" y="172" font-size="20" font-weight="600" fill="#18181b">Cline</text>
  <text x="580" y="200" font-size="13" fill="#71717a">Cline · open-source coding agent</text>
  <rect x="580" y="224" width="120" height="40" rx="8" fill="#0e639c"/>
  <text x="640" y="249" text-anchor="middle" font-size="14" fill="#ffffff">Install</text>

  <text x="580" y="306" font-size="13" fill="#18181b">Cline reads your files, proposes edits and</text>
  <text x="580" y="328" font-size="13" fill="#18181b">runs commands — you approve every step.</text>

  <text x="580" y="388" font-size="13" fill="#71717a">After installing, open the Cline panel, pick a</text>
  <text x="580" y="410" font-size="13" fill="#71717a">model provider and paste your API key (or</text>
  <text x="580" y="432" font-size="13" fill="#71717a">sign in to use Cline's own plans).</text>

  <rect x="580" y="480" width="420" height="140" rx="12" fill="#f4f4f5"/>
  <text x="602" y="510" font-size="13" fill="#18181b">The extension itself is free and open source.</text>
  <text x="602" y="534" font-size="13" fill="#71717a">You pay only for the model API you choose.</text>
  <text x="602" y="566" font-size="13" fill="#71717a">Shortcut: Ctrl/Cmd + Shift + X</text>
  <text x="602" y="592" font-size="13" fill="#71717a">Look for the Cline icon in the activity bar</text>

  <text x="1180" y="740" text-anchor="end" fill="#a1a1aa" font-size="13">示意图</text>
</svg>
