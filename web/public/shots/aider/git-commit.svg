<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>

  <rect x="120" y="70" width="960" height="620" rx="16" fill="#0b0b0f"/>
  <path d="M136 70 h928 a16 16 0 0 1 16 16 v28 h-960 v-28 a16 16 0 0 1 16 -16 z" fill="#27272a"/>
  <rect x="120" y="70" width="960" height="620" rx="16" fill="none" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="156" cy="92" r="7" fill="#ff5f57"/>
  <circle cx="178" cy="92" r="7" fill="#febc2e"/>
  <circle cx="200" cy="92" r="7" fill="#28c840"/>
  <text x="600" y="97" text-anchor="middle" fill="#a1a1aa" font-size="15">aider — git</text>

  <text x="160" y="196" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#d4d4d8">Auto-commit is on: every change becomes a commit.</text>
  <text x="160" y="228" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">Bad change? Revert it and keep going — nothing is lost.</text>

  <text x="160" y="288" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">$ git log --oneline -3</text>

  <text x="160" y="326" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e4e4e7">7f3a1c2 aider: add /health endpoint</text>
  <text x="160" y="354" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">b91d0aa aider: extract the validateToken helper</text>
  <text x="160" y="382" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">4c8f221 chore: initial commit</text>

  <line x1="160" y1="424" x2="1040" y2="424" stroke="#3f3f46" stroke-width="1"/>

  <text x="160" y="470" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">To undo the last change:</text>
  <text x="160" y="504" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#22d3ee">/undo            inside aider</text>
  <text x="160" y="536" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#22d3ee">git revert HEAD  from your own shell</text>

  <text x="160" y="596" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">Aider adds itself to .gitignore entries and never touches</text>
  <text x="160" y="624" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">files listed in .aiderignore.</text>

  <text x="1180" y="740" text-anchor="end" fill="#a1a1aa" font-size="13">示意图</text>
</svg>
