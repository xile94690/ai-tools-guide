<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>

  <rect x="120" y="70" width="960" height="620" rx="16" fill="#0b0b0f"/>
  <path d="M136 70 h928 a16 16 0 0 1 16 16 v28 h-960 v-28 a16 16 0 0 1 16 -16 z" fill="#27272a"/>
  <rect x="120" y="70" width="960" height="620" rx="16" fill="none" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="156" cy="92" r="7" fill="#ff5f57"/>
  <circle cx="178" cy="92" r="7" fill="#febc2e"/>
  <circle cx="200" cy="92" r="7" fill="#28c840"/>
  <text x="600" y="97" text-anchor="middle" fill="#a1a1aa" font-size="15">codex — /permissions</text>

  <text x="160" y="192" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#d4d4d8">Choose what Codex is allowed to do:</text>

  <rect x="148" y="224" width="904" height="76" rx="10" fill="#164e63"/>
  <text x="176" y="258" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#ffffff">:read-only</text>
  <text x="360" y="258" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#67e8f9">Read files, ask before any command or edit</text>
  <text x="176" y="282" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a1a1aa">Good default when you are exploring a new repo</text>

  <rect x="148" y="314" width="904" height="76" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="176" y="348" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#e4e4e7">:workspace</text>
  <text x="360" y="348" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">Edit files in the workspace, network still gated</text>
  <text x="176" y="372" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a1a1aa">sandbox_mode = "workspace-write"</text>

  <rect x="148" y="404" width="904" height="76" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="176" y="438" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#e4e4e7">:danger-full-access</text>
  <text x="420" y="438" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">No sandbox, no approval prompts</text>
  <text x="176" y="462" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a1a1aa">Only inside a disposable container</text>

  <line x1="160" y1="556" x2="1040" y2="556" stroke="#3f3f46" stroke-width="1"/>

  <text x="160" y="606" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">↑↓ select   enter confirm   esc cancel</text>

  <text x="160" y="660" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#e4e4e7"><tspan fill="#22d3ee">&gt;</tspan><tspan x="184">/permissions</tspan></text>

  <text x="1180" y="740" text-anchor="end" fill="#a1a1aa" font-size="13">示意图</text>
</svg>
