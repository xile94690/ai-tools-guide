  <text x="334" y="218" fill="#a1a1aa" font-size="13">Lyrics</text>
  <text x="334" y="252" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#22d3ee">[Verse]</text>
  <text x="334" y="280" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#e4e4e7">Neon glow on the desk at midnight</text>
  <text x="334" y="312" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#22d3ee">[Chorus]</text>
  <text x="334" y="340" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#e4e4e7">We keep the fire low, let it burn slow</text>

  <rect x="310" y="400" width="745" height="70" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="334" y="426" fill="#a1a1aa" font-size="13">Style of Music</text>
  <text x="334" y="452" fill="#e4e4e7" font-size="15">lo-fi chillhop, mellow piano, vinyl crackle, 80 bpm</text>

  <rect x="310" y="486" width="360" height="62" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="334" y="512" fill="#a1a1aa" font-size="13">Title</text>
  <text x="334" y="536" fill="#e4e4e7" font-size="15">Midnight Study</text>

  <text x="700" y="512" fill="#e4e4e7" font-size="14">Instrumental</text>
  <rect x="812" y="498" width="52" height="26" rx="13" fill="#3f3f46"/>
  <circle cx="826" cy="511" r="10" fill="#a1a1aa"/>

  <rect x="860" y="486" width="195" height="62" rx="12" fill="#22d3ee"/>
  <text x="957" y="524" text-anchor="middle" fill="#0b0b0f" font-size="16" font-weight="700">Create</text>

  <text x="310" y="586" fill="#a1a1aa" font-size="13">Custom 模式：歌词 / 风格 / 标题三段式，可控性最高</text>
  <text x="310" y="612" fill="#a1a1aa" font-size="13">Simple 模式：只写一句描述，让 Suno 自动填词</text>

  <text x="310" y="654" fill="#71717a" font-size="13">每次生成会同时产出两个版本（两个 take），挑更好的继续</text>

