<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>

  <rect x="120" y="70" width="960" height="620" rx="16" fill="#ffffff"/>
  <path d="M136 70 h928 a16 16 0 0 1 16 16 v28 h-960 v-28 a16 16 0 0 1 16 -16 z" fill="#f4f4f5"/>
  <line x1="120" y1="114" x2="1080" y2="114" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="120" y="70" width="960" height="620" rx="16" fill="none" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="156" cy="92" r="7" fill="#ff5f57"/>
  <circle cx="178" cy="92" r="7" fill="#febc2e"/>
  <circle cx="200" cy="92" r="7" fill="#28c840"/>

  <rect x="420" y="78" width="360" height="28" rx="14" fill="#e4e4e7"/>
  <text x="600" y="97" text-anchor="middle" fill="#71717a" font-size="14">Windsurf — first launch</text>

  <rect x="380" y="150" width="560" height="470" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>

  <text x="600" y="206" text-anchor="middle" fill="#18181b" font-size="22" font-weight="600">Welcome to Windsurf</text>
  <text x="600" y="236" text-anchor="middle" fill="#71717a" font-size="13">Set up your editor in three steps</text>

  <text x="420" y="296" fill="#18181b" font-size="15" font-weight="600">1  Select your theme</text>
  <rect x="420" y="312" width="150" height="46" rx="10" fill="#18181b"/>
  <text x="495" y="340" text-anchor="middle" fill="#ffffff" font-size="13">System</text>
  <rect x="584" y="312" width="150" height="46" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="659" y="340" text-anchor="middle" fill="#18181b" font-size="13">Light</text>
  <rect x="748" y="312" width="150" height="46" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="823" y="340" text-anchor="middle" fill="#18181b" font-size="13">Dark</text>

  <text x="420" y="410" fill="#18181b" font-size="15" font-weight="600">2  Import settings (optional)</text>
  <rect x="420" y="426" width="230" height="48" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="535" y="456" text-anchor="middle" fill="#18181b" font-size="13">Import from VS Code</text>
  <rect x="668" y="426" width="230" height="48" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="783" y="456" text-anchor="middle" fill="#18181b" font-size="13">Import from Cursor</text>

  <text x="420" y="524" fill="#18181b" font-size="15" font-weight="600">3  Sign in</text>
  <rect x="420" y="540" width="230" height="48" rx="10" fill="#18181b"/>
  <text x="535" y="570" text-anchor="middle" fill="#ffffff" font-size="13">Sign in</text>

  <text x="420" y="616" fill="#a1a1aa" font-size="12">You can change all of this later in Settings.</text>

  <text x="1180" y="740" text-anchor="end" fill="#a1a1aa" font-size="13">示意图</text>
</svg>
