<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>

  <rect x="120" y="70" width="960" height="620" rx="16" fill="#ffffff"/>
  <path d="M136 70 h928 a16 16 0 0 1 16 16 v28 h-960 v-28 a16 16 0 0 1 16 -16 z" fill="#f4f4f5"/>
  <line x1="120" y1="114" x2="1080" y2="114" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="120" y="70" width="960" height="620" rx="16" fill="none" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="156" cy="92" r="7" fill="#ff5f57"/>
  <circle cx="178" cy="92" r="7" fill="#febc2e"/>
  <circle cx="200" cy="92" r="7" fill="#28c840"/>

  <rect x="380" y="78" width="440" height="28" rx="14" fill="#e4e4e7"/>
  <text x="600" y="97" text-anchor="middle" fill="#71717a" font-size="14">Customizations — Rules</text>

  <text x="180" y="178" font-size="20" font-weight="600" fill="#18181b">Customizations</text>
  <text x="180" y="206" font-size="13" fill="#71717a">Rules tell Cascade how to behave. They are read automatically on every task.</text>

  <rect x="180" y="230" width="860" height="60" rx="10" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <text x="204" y="266" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#18181b">AGENTS.md</text>
  <text x="360" y="266" font-size="13" fill="#71717a">project root — always on</text>
  <rect x="960" y="248" width="56" height="26" rx="13" fill="#18181b"/>
  <circle cx="1002" cy="261" r="10" fill="#ffffff"/>

  <rect x="180" y="304" width="860" height="60" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="204" y="340" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#18181b">.windsurf/rules/testing.md</text>
  <text x="460" y="340" font-size="13" fill="#71717a">trigger: glob — *_test.ts</text>
  <rect x="960" y="322" width="56" height="26" rx="13" fill="#18181b"/>
  <circle cx="1002" cy="335" r="10" fill="#ffffff"/>

  <rect x="180" y="378" width="860" height="60" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="204" y="414" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#18181b">global_rules.md</text>
  <text x="360" y="414" font-size="13" fill="#71717a">user level — applies to every project</text>
  <rect x="960" y="396" width="56" height="26" rx="13" fill="#18181b"/>
  <circle cx="1002" cy="409" r="10" fill="#ffffff"/>

  <rect x="180" y="474" width="180" height="44" rx="10" fill="#18181b"/>
  <text x="270" y="502" text-anchor="middle" font-size="13" fill="#ffffff">+ Global</text>
  <rect x="378" y="474" width="180" height="44" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="468" y="502" text-anchor="middle" font-size="13" fill="#18181b">+ Workspace</text>

  <text x="180" y="570" font-size="13" fill="#a1a1aa">Activation is set per file with frontmatter: trigger: always_on | model_decision | glob | manual</text>
  <text x="180" y="596" font-size="13" fill="#a1a1aa">Workspace rules are version-controlled — commit them so your team shares the same behaviour.</text>

  <text x="1180" y="740" text-anchor="end" fill="#a1a1aa" font-size="13">示意图</text>
</svg>
