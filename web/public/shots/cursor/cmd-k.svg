  <text x="226" y="462" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#18181b">add empty-password validation, return 400</text>

  <text x="160" y="524" font-size="14" fill="#71717a">Enter to generate · Esc to cancel · the edit is applied in place, review the diff before accepting</text>

  <text x="160" y="580" font-size="13" fill="#a1a1aa">On Windows / Linux the same shortcut is Ctrl+K. Ctrl/Cmd+L opens the chat panel instead.</text>

