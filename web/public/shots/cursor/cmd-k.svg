  <text x="160" y="166" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">src/auth/login.ts</text>

  <text x="160" y="214" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#18181b">export async function login(email, password) {</text>
  <text x="160" y="246" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#18181b">  const user = await db.users.findByEmail(email);</text>

  <rect x="148" y="262" width="860" height="34" rx="6" fill="#e0e7ff"/>
  <text x="160" y="286" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#18181b">  if (!user) return res.status(401).json({ error: "invalid" });</text>

  <text x="160" y="326" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#18181b">  const ok = await bcrypt.compare(password, user.hash);</text>
  <text x="160" y="358" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#18181b">  return ok ? createSession(user) : res.status(401);</text>
  <text x="160" y="390" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#18181b">}</text>

  <rect x="148" y="428" width="700" height="56" rx="12" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
  <rect x="166" y="444" width="44" height="24" rx="6" fill="#18181b"/>
