  <text x="234" y="302" font-size="12" fill="#71717a">GitHub</text>
  <rect x="234" y="310" width="76" height="22" rx="6" fill="#0e639c"/>
  <text x="272" y="326" text-anchor="middle" font-size="12" fill="#ffffff">Install</text>

