  <text x="176" y="402" font-size="12" fill="#71717a">GitHub</text>

  <text x="176" y="452" font-size="14" font-weight="600" fill="#18181b">GitHub Copilot for JetBrains</text>
  <text x="176" y="472" font-size="12" fill="#71717a">GitHub</text>

  <text x="160" y="548" font-size="12" fill="#71717a">Shortcut: Ctrl/Cmd + Shift + X</text>

  <text x="580" y="172" font-size="20" font-weight="600" fill="#18181b">GitHub Copilot</text>
  <text x="580" y="200" font-size="13" fill="#71717a">GitHub · AI pair programmer</text>
  <rect x="580" y="224" width="120" height="40" rx="8" fill="#0e639c"/>
  <text x="640" y="249" text-anchor="middle" font-size="14" fill="#ffffff">Install</text>

  <text x="580" y="306" font-size="13" fill="#18181b">Your AI pair programmer. It suggests code</text>
  <text x="580" y="328" font-size="13" fill="#18181b">as you type and answers questions in</text>
  <text x="580" y="350" font-size="13" fill="#18181b">Copilot Chat.</text>

  <text x="580" y="410" font-size="13" fill="#71717a">After installing, sign in with your GitHub</text>
  <text x="580" y="432" font-size="13" fill="#71717a">account from the Accounts menu, then</text>
  <text x="580" y="454" font-size="13" fill="#71717a">reload the window.</text>

  <rect x="580" y="500" width="420" height="120" rx="12" fill="#f4f4f5"/>
  <text x="602" y="530" font-size="13" fill="#18181b">Requires an active Copilot subscription.</text>
  <text x="602" y="554" font-size="13" fill="#71717a">Students and teachers can get it free</text>
  <text x="602" y="576" font-size="13" fill="#71717a">after verifying at education.github.com.</text>
  <text x="602" y="600" font-size="13" fill="#71717a">Reload window: Ctrl/Cmd + Shift + P</text>

